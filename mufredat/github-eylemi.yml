# Ders müfredatını (haftalık konular) okulun sitesinden ayda bir tazeler.
# Çalışması için depoda .github/workflows/mufredat.yml adıyla durmalı (bu dosya oraya kopyalanır).
# Elle çalıştırmak için: GitHub → Actions → "Müfredatı güncelle" → Run workflow.
name: Müfredatı güncelle

on:
  schedule:
    - cron: '17 3 2 * *'   # her ayın 2'si, 06:17 (TSİ)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Müfredatı çek
        run: node mufredat/guncelle.mjs
      - name: Değiştiyse gönder
        run: |
          if git diff --quiet -- mufredat/tobb-etu.json; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mufredat/tobb-etu.json
          git commit -m "Müfredat güncellendi"
          git push
