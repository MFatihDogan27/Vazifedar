<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vazifedar</title>
  <meta name="description" content="Kişisel takvim, ders programı ve görev planlayıcı — Google Takvim ile eşitlenir.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="icons/kadran.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/kadran-apple-180.png">
  <meta name="theme-color" content="#F4F5F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13162B" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vazifedar">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/takvim.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="3.2"/>
          <path d="M20 20 L20 8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M20 20 L28.5 25" stroke="var(--ink)" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="20" cy="20" r="3.4" fill="var(--ink)"/>
        </svg>
        <span class="brand-name">Vazifedar</span>
      </div>
      <nav class="nav nav-top" aria-label="Bölümler"></nav>
      <div id="qa-slot" class="qa-slot"></div>
      <div id="search-slot" class="search-slot"></div>
      <div id="side-sync" class="side-sync"></div>
    </header>

    <main class="main">
      <header id="toolbar" class="toolbar"></header>
      <section id="view" class="view"></section>
    </main>

    <nav class="nav nav-bottom" aria-label="Bölümler"></nav>
  </div>

  <div id="boot" class="boot">
    <p><strong>Vazifedar yükleniyor…</strong></p>
    <p>Bu yazı kaybolmuyorsa sayfayı dosyaya çift tıklayarak açmışsındır. Klasördeki <code>baslat.bat</code> dosyasıyla aç (ya da <code>http://localhost:8080</code>).</p>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
